<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <a class="brand" routerLink="/" (click)="closeSidebar()">
      <span class="brand-mark"> CD </span>
      <span>Concurso Dev<br><b>Plano de Estudos</b></span>
    </a>
    <nav aria-label="Navegação principal">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeSidebar()">
        <span class="nav-icon">◉</span> Visão geral
      </a>
      <a class="nav-link" routerLink="/disciplinas" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">▦</span> Disciplinas
      </a>
      <a class="nav-link" routerLink="/cronograma" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">◫</span> Cronograma
      </a>
      <a class="nav-link" routerLink="/simulado" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">⏱</span> Simulado
      </a>
    </nav>
    <div class="exam-mini">
      <span>PRÓXIMO MARCO</span>
      <strong>11 OUT 2026</strong>
      <small>Prova · 13h às 17h</small>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <header class="topbar">
      <button id="menuButton" class="menu-button" (click)="toggleSidebar()" aria-label="Abrir menu">☰</button>
      <p>ANALISTA DE TI <span>/</span> DESENVOLVIMENTO DE SOFTWARE</p>
      <button id="themeButton" class="theme-button" (click)="toggleTheme()" aria-label="Alternar tema">◐</button>
    </header>

    <router-outlet />

    <footer class="app-footer">
      <span>Developed by Eduardo Lessa</span>
      <span>© 2026</span>
    </footer>
  </main>
</div>
